<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modo Professor — IA para Empreendedores</title><meta name="robots" content="noindex">
<style>
:root{--a:#4f46e5;--b:#0d9488}*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0b1020;color:#fff;overflow:hidden}
#bg{position:fixed;inset:0;background:radial-gradient(900px 500px at 90% -10%,var(--a),transparent 65%),radial-gradient(800px 500px at -10% 110%,var(--b),transparent 65%),#0b1020;opacity:.55;transition:.4s}
#stage{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:5vh 7vw}
.tag{font-size:clamp(14px,1.8vw,24px);letter-spacing:.18em;font-weight:800;color:#fde68a;text-transform:uppercase;margin-bottom:2vh}
h1{font-size:clamp(34px,6.2vw,92px);line-height:1.05;margin:0 0 3vh;letter-spacing:-.02em}
h2{font-size:clamp(28px,4.4vw,64px);line-height:1.1;margin:0 0 3vh}
p,li{font-size:clamp(20px,2.9vw,42px);line-height:1.35;margin:.4em 0}ul,ol{padding-left:1.2em;margin:0}
.prompt.long{font-size:clamp(15px,1.9vw,27px)}.prompt{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);border-left:10px solid #f59e0b;border-radius:18px;padding:2.2vh 2vw;font-size:clamp(18px,2.5vw,36px);line-height:1.4}
.pill{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:.3em .9em;font-size:clamp(14px,1.8vw,26px);margin:.2em .3em .2em 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw}.grid button{font:inherit;font-size:clamp(14px,1.9vw,26px);padding:1.6vh 1vw;border-radius:16px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;text-align:left}.grid button:hover{background:rgba(255,255,255,.22)}
#bar{position:fixed;left:0;top:0;height:6px;background:linear-gradient(90deg,#f59e0b,#fff);width:0;transition:width .2s}
#hud{position:fixed;right:2vw;top:1.5vh;font-size:14px;opacity:.65}
#notes{position:fixed;left:0;right:0;bottom:0;background:#fffbeb;color:#3b2a00;padding:1.5vh 3vw;font-size:clamp(15px,1.7vw,22px);display:none;border-top:6px solid #f59e0b}
#notes.on{display:block}.help{font-size:14px;opacity:.7;margin-top:3vh}
</style></head><body><div id="bg"></div><div id="bar"></div><main id="stage"></main><div id="notes"></div><div id="hud"></div>
<script>
const C=[["#4f46e5","#7c3aed"],["#7c3aed","#db2777"],["#0d9488","#0891b2"],["#2563eb","#4f46e5"],["#d97706","#e11d48"],["#0891b2","#0d9488"],["#ea580c","#d97706"],["#059669","#0d9488"],["#be123c","#7c3aed"]];
const L=[
{t:"Fundamentos de IA",obj:"Entender o que é IA e decidir quando usar regra ou IA.",ideia:"IA ajuda a lidar com informação: ler, organizar e rascunhar.",an:"Um assistente muito rápido, recém-contratado: produz depressa, mas precisa de orientação e conferência.",demo:"Abra o Gemini e peça a explicação; depois peça para trocar a palavra difícil.",p:"Explique “inteligência artificial” para um cliente de cafeteria em 3 frases, sem termos técnicos.",obs:["A linguagem ficou simples?","Alguma palavra ainda é técnica?","Quem decide o que usar: você."],q:"Calcular o preço de 2 cafés: regra ou IA? E resumir 50 comentários?",ponte:"Próxima: IA que classifica × IA que cria.",fala:"Mostre que a IA é ferramenta. Use a cafeteria como fio condutor."},
{t:"IA Generativa",obj:"Diferenciar IA que classifica de IA que cria e testar no Gemini.",ideia:"A IA generativa produz conteúdo novo: texto, resumo, ideias, imagens.",an:"Calculadora × oficina criativa: uma devolve um resultado exato, a outra propõe rascunhos.",demo:"Rode o mesmo recado em três transformações: resumir, organizar, reformular. Depois compare duas ferramentas.",p:"Escreva um aviso de 40 palavras dizendo que a Café Horizonte fecha mais cedo na sexta por manutenção. Tom acolhedor. Não invente horário.",obs:["Ele inventou um horário?","O tom ficou acolhedor?","Qual ferramenta pediu menos ajuste?"],q:"Por que rascunho de IA não é texto final?",ponte:"Próxima: onde isso ajuda um negócio.",fala:"Projete as duas respostas lado a lado. Não declare vencedora."},
{t:"IA nos Negócios",obj:"Encontrar onde a IA ajuda e priorizar uma dor real.",ideia:"Comece pelo problema, não pela ferramenta.",an:"Caixa de ferramentas: um martelo é ótimo, mas não serve para tudo.",demo:"Liste 3 dores da cafeteria, escolha 1 e peça legenda + ideia de imagem.",p:"Crie uma legenda de Instagram de 30 palavras e descreva uma imagem para divulgar o combo café + pão de queijo. Não cite preço nem prazo.",obs:["Há preço ou promessa inventada?","O nome do produto está certo?","Serve para o canal escolhido?"],q:"Qual tarefa do seu negócio consome mais tempo?",ponte:"Próxima: como pedir direito (C.O.I.R.F.).",fala:"Se houver conta, gere a imagem; senão mostre a descrição. Não publique."},
{t:"Prompts C.O.I.R.F.",obj:"Escrever pedidos claros com Contexto, Objetivo, Instrução, Restrições e Formato.",ideia:"Um bom prompt é um bom briefing.",an:"Pedir “uma arte bonita” a um designer: ele precisa perguntar tudo de volta.",demo:"Compare “Escreva um anúncio” com a versão C.O.I.R.F. e depois salve como Gem ou na biblioteca.",p:"Contexto: cafeteria de bairro. Objetivo: divulgar combo. Instrução: anúncio para Instagram. Restrições: sem preço inventado. Formato: 30 palavras e 3 hashtags.",obs:["Qual das 5 peças mudou mais o resultado?","Funciona de novo com outros dados?"],q:"Que peça falta no pedido “faça um post”?",ponte:"Próxima: melhorar e conferir a resposta.",fala:"Use o construtor de prompt do site ao vivo."},
{t:"Refinamento e Validação",obj:"Melhorar respostas por rodadas e conferir antes de usar.",ideia:"A primeira resposta é ponto de partida. Refinar ajusta; validar confere.",an:"Revisar um rascunho: reler, ajustar e só então enviar.",demo:"Faça o teste A/B (vago × C.O.I.R.F.), pontue de 0 a 2 em 5 critérios e refine o B.",p:"Reescreva mais curto, tom mais caloroso, sem prometer prazo. Mantenha o nome do produto.",obs:["Placar A × B × B refinado","Algo foi prometido sem base?"],q:"O que é refinar e o que é validar?",ponte:"Próxima: arquivos, Canvas e pesquisa.",fala:"Projete o placar e deixe a turma pontuar."},
{t:"Produtividade",obj:"Escolher o recurso pela natureza da tarefa: arquivo, Canvas, pesquisa ou fontes próprias.",ideia:"Do bate-papo ao trabalho com informação real.",an:"Uma biblioteca com bom assistente: ele localiza, mas você confere a fonte.",demo:"Carregue 3 documentos fictícios no NotebookLM (se disponível) e pergunte; depois pergunte ao Gemini sem anexos.",p:"Com base apenas nas fontes, qual é a política de troca? Se não estiver nas fontes, diga que não encontrou.",obs:["A resposta cita o documento?","O que ele fez quando não havia resposta?","E a conversa sem fonte?"],q:"Quando usar arquivo, Canvas ou pesquisa?",ponte:"Próxima: transformar tudo isso em processo.",fala:"Destaque: fonte própria reduz invenção, mas não dispensa conferência."},
{t:"Processos e Automação",obj:"Desenhar fluxos com gatilho, ação, conferência humana e resultado.",ideia:"Automatize depois de compreender o processo.",an:"Campainha e gatilho: o fluxo só começa quando algo acontece.",demo:"Formulário com 5 pedidos fictícios, planilha, Gemini classifica e rascunha, humano confere. Opcional: mostrar o mesmo fluxo no Make, Zapier ou n8n.",p:"Para cada pedido, informe categoria (dúvida, reclamação, elogio, pedido) e rascunho de 25 palavras. Não prometa prazos.",obs:["Onde está o gatilho?","Onde a pessoa decide?","O que pode dar errado em cada passo?"],q:"Qual passo você nunca automatizaria sem conferência?",ponte:"Próxima: dados, segurança e ética.",fala:"Use somente dados fictícios na demonstração."},
{t:"Segurança, Privacidade e Ética",obj:"Decidir o que pode ser compartilhado e usar IA com responsabilidade.",ideia:"Minimize dados, proteja o que for sensível e revise sempre.",an:"Armários com chaves diferentes: nem todo documento vai para a mesma porta.",demo:"Classifique 6 trechos em verde, amarelo ou vermelho e anonimize os amarelos.",p:"Substitua nomes, telefones, e-mails e documentos por marcadores como [CLIENTE] e [TELEFONE].",obs:["Quem responde pelo texto?","O dado era necessário?","A LGPD foi considerada?"],q:"Você colaria a planilha de clientes na IA? O que removeria antes?",ponte:"Próxima: reunir tudo no projeto final.",fala:"Reforce: responsabilidade é de quem usa, não da ferramenta."},
{t:"Projeto Final",obj:"Aplicar o método completo a uma melhoria real e apresentar resultados.",ideia:"Problema, tarefa, prompt, refinamento, conferência, medição, apresentação.",an:"A planta de uma pequena reforma: planejar antes de executar.",demo:"Preencha o quadro: tempo antes × depois, refinamentos e erros achados; apresente em 2 minutos.",p:"Use o prompt C.O.I.R.F. construído pelo grupo, com dados fictícios.",obs:["Há números, não só texto?","O que foi conferido?","O que mudaria?"],q:"Qual foi o maior ganho e o maior cuidado do seu projeto?",ponte:"Encerramento: guarde seus prompts e siga para o aperfeiçoamento.",fala:"Valorize a evidência: números e a conferência humana."}
];
const S=[];S.push({k:-1,h:`<div class="tag">Modo Professor</div><h1>IA para Empreendedores</h1><p>Iniciação profissional · 9 aulas</p><p class="help">← → ou espaço: navegar · F: tela cheia · N: notas · Z: Aula Zero · 1–9: ir para a aula · 0: índice</p>`,n:"Abra o índice (tecla 0) para pular entre as aulas."});
S.push({k:-1,idx:1,h:`<div class="tag">Índice</div><h2>Escolha a aula</h2><div class="grid"><button data-go="z">Aula Zero</button>${L.map((a,i)=>`<button data-go="${i}">${i+1}. ${a.t}</button>`).join('')}</div>`,n:"Clique ou digite o número da aula."});
S.push(...[{"k": 0, "aula": "z", "h": "<div class=\"tag\">Aula Zero</div><h1>Aprenda a conversar com a IA</h1><p>Laboratório guiado dentro da Aula 1 · 35 a 45 min</p>", "n": "Combinados: dados fictícios, sem informações pessoais. Verifique antes quais recursos estão habilitados."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero</div><h2>Caminho mínimo</h2><p>Experimentos 1, 2, 4 e 7.</p><p>Os demais são opcionais, conforme tempo e acesso.</p>", "n": "Use o caminho mínimo se o acesso da turma for limitado."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 01 · Essencial</div><h2>Comece com uma pergunta simples</h2><p>Observar a resposta inicial e identificar o que ainda não ficou claro.</p><div class=\"prompt\">Explique o que é Inteligência Artificial Generativa em até cinco frases.</div>", "n": "Peça que cada aluno digite o primeiro comando sem contexto; depois acrescente público e situação e compare. O aluno não precisa de fórmula: precisa explicar o que deseja."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 02 · Essencial</div><h2>Adapte a explicação ao público</h2><p>Orientar a linguagem e o contexto da resposta.</p><div class=\"prompt long\">Reexplique Inteligência Artificial Generativa para alguém que administra um pequeno negócio e não trabalha com tecnologia. Use linguagem simples e um exemplo de atendimento. Termine dizendo o que a IA não consegue saber sem receber dados confiáveis.</div>", "n": "Compare com a primeira resposta: o que mudou ao acrescentar público e situação?"}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 03 · Opcional</div><h2>Use uma analogia com limites</h2><p>Aproximar um conceito difícil sem esconder diferenças importantes.</p><div class=\"prompt\">Compare uma IA generativa a um assistente que recebe um briefing e prepara um rascunho. Mostre três semelhanças e duas diferenças importantes. Explique por que a resposta ainda precisa ser conferida por uma pessoa.</div>", "n": "Não aceite a analogia como explicação final: pergunte onde funciona e onde falha."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 04 · Essencial</div><h2>Aplique a um negócio</h2><p>Transformar conceito em possibilidades concretas.</p><div class=\"prompt long\">Imagine a Café Horizonte. Ela recebe dúvidas sobre horário, cardápio e disponibilidade de kits. Monte uma tabela com cinco tarefas em que a IA poderia ajudar. Para cada tarefa, informe: o que a pessoa fornece, o que a IA pode produzir e o que alguém precisa conferir. Não invente horários, preços ou estoque.</div>", "n": "Exija tarefa delimitada e responsável pela validação; evite “usar IA para melhorar vendas”."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 05 · Opcional</div><h2>Transforme a IA em tutora</h2><p>Aprender por perguntas e feedback progressivo.</p><div class=\"prompt long\">Seja meu tutor sobre a diferença entre regra, automação e Inteligência Artificial Generativa. Não entregue uma aula inteira de uma vez. Faça uma pergunta por vez, espere minha resposta, explique o que acertei ou confundi e só então avance. Termine com um caso empresarial para eu resolver.</div>", "n": "Uma pergunta por vez. Se a IA revelar a resposta antes da tentativa, peça que reinicie."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 06 · Opcional</div><h2>Crie um recurso visual no Canvas</h2><p>Transformar uma explicação em um material de consulta.</p><div class=\"prompt long\">Crie um guia visual de uma página sobre IA em pequenos negócios. Organize em cinco blocos: criação de conteúdo, organização de informações, atendimento, apoio à gestão e validação humana. Use pouco texto, exemplos concretos e destaque o que precisa ser conferido antes de usar o resultado.</div>", "n": "Guia visual de uma página; não vire tutorial da interface. Alternativa: esquema textual na conversa."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 07 · Essencial</div><h2>Analise arquivos</h2><p>Responder com base em documentos fornecidos.</p><div class=\"prompt long\">Use somente os arquivos anexados. Responda: (1) em quais dias a Café Horizonte funciona? (2) o que compõe o combo? (3) a cafeteria faz entregas? Para cada resposta, indique o arquivo e o trecho que sustenta a informação. Se algo não estiver nos arquivos, escreva exatamente: “não consta nas fontes”. Não complete lacunas por suposição.</div>", "n": "Use os 3 arquivos. Exija fonte e a frase “não consta nas fontes”. Resposta plausível não é evidência."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 08 · Opcional</div><h2>Organize fontes em um notebook</h2><p>Consultar várias fontes e produzir materiais de estudo.</p><div class=\"prompt long\">Com base somente nas fontes deste notebook, crie um guia de consulta para responder dúvidas de clientes. Inclua: informações confirmadas, informações que não constam e perguntas que precisam ser encaminhadas à equipe. Acrescente referências às fontes utilizadas e crie cinco perguntas para testar minha compreensão.</div>", "n": "Mesmas fontes em um notebook; compare com a conversa aberta e explore citações. Alternativa: anexar os arquivos no Gemini."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 09 · Opcional</div><h2>Converse por voz</h2><p>Experimentar outra forma de interação.</p><div class=\"prompt long\">Quero estudar Inteligência Artificial Generativa. Converse comigo como um professor: faça uma pergunta por vez, espere minha resposta e, se eu demonstrar dúvida, explique de outra maneira usando um exemplo de pequeno negócio. No final, resuma três ideias que aprendi e uma dúvida que ainda preciso investigar.</div>", "n": "Demonstração curta. Sem o recurso, use ditado ou texto."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 10 · Opcional</div><h2>Faça uma pesquisa aprofundada</h2><p>Explorar fontes, datas e evidências.</p><div class=\"prompt long\">Pesquise exemplos recentes de uso de Inteligência Artificial Generativa em pequenos negócios no Brasil, com foco em atendimento e marketing. Antes de escrever o relatório, apresente um plano de pesquisa. Use fontes identificáveis, informe datas, separe fatos encontrados de recomendações e destaque limitações ou pontos sem evidência suficiente.</div>", "n": "Opcional: mostre o plano de pesquisa e peça que a turma critique fontes, datas e perguntas; não espere o relatório."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero · Experimento 11 · Opcional</div><h2>Peça uma revisão crítica</h2><p>Identificar suposições, lacunas e possíveis erros.</p><div class=\"prompt long\">Revise sua resposta anterior. Separe: (1) fatos sustentados pelas fontes; (2) suposições; (3) informações ausentes; (4) afirmações que precisam de confirmação. Depois reescreva o texto sem inventar dados e marque com [CONFIRMAR] tudo o que depender de uma pessoa ou sistema externo.</div>", "n": "Peça fatos, suposições e lacunas; o aluno identifica uma afirmação a conferir fora da IA."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero</div><h2>Monte um prompt C.O.I.R.F.</h2><ul><li>Contexto</li><li>Objetivo</li><li>Instrução</li><li>Restrições</li><li>Formato</li></ul><p><span class=\"pill\">Aprofundado na Aula 4</span></p>", "n": "A estrutura organiza o pedido, mas não garante a verdade da resposta."}, {"k": 0, "h": "<div class=\"tag\">Aula Zero</div><h2>O que mudou quando acrescentamos contexto e restrições?</h2><p><span class=\"pill\">Próxima: Aula 1 · Fundamentos de IA</span></p>", "n": "A Aula Zero prepara o aluno; não substitui o conteúdo da Aula 1."}]);
L.forEach((a,i)=>{const T=`<div class="tag">Aula ${i+1}</div>`;
S.push({k:i,aula:i,h:`${T}<h1>${a.t}</h1><p>${a.obj}</p>`,n:a.fala});
S.push({k:i,h:`${T}<h2>Ideia central</h2><p>${a.ideia}</p><p>💡 ${a.an}</p>`,n:"Explique com suas palavras; peça um exemplo da turma."});
S.push({k:i,h:`${T}<h2>Demonstração ao vivo</h2><p>${a.demo}</p><div class="prompt">${a.p}</div>`,n:"Dados fictícios. Se o recurso não estiver disponível na sua conta, mostre a captura ou descreva."});
S.push({k:i,h:`${T}<h2>O que observar no resultado</h2><ul>${a.obs.map(x=>`<li>${x}</li>`).join('')}</ul>`,n:"Deixe a turma apontar antes de você responder."});
S.push({k:i,h:`${T}<h2>Pergunta para a turma</h2><p>${a.q}</p><p><span class="pill">${a.ponte}</span></p>`,n:"Se der, abra a página da aula no site para as práticas."});});
S.push({k:-1,h:`<div class="tag">Fechamento</div><h1>Método: pedir, refinar, conferir</h1><p>Dados fictícios, revisão humana e responsabilidade sempre.</p>`,n:"Lembre que o certificado do site é simbólico; a frequência é controlada à parte."});
let i=0;const st=document.getElementById('stage'),nt=document.getElementById('notes');
function show(n){i=Math.max(0,Math.min(S.length-1,n));const s=S[i];st.innerHTML=s.h;nt.textContent='Notas: '+s.n;const c=C[s.k<0?0:s.k];document.documentElement.style.setProperty('--a',c[0]);document.documentElement.style.setProperty('--b',c[1]);document.getElementById('bar').style.width=(i/(S.length-1)*100)+'%';document.getElementById('hud').textContent=(i+1)+' / '+S.length;st.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(S.findIndex(x=>x.aula===(b.dataset.go==='z'?'z':+b.dataset.go))))}
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();show(i+1)}else if(k==='ArrowLeft'||k==='PageUp')show(i-1);else if(k==='Home')show(0);else if(k==='End')show(S.length-1);else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else if(k==='n'||k==='N')nt.classList.toggle('on');else if(k==='0')show(1);else if(k==='z'||k==='Z')show(S.findIndex(x=>x.aula==='z'));else if(/^[1-9]$/.test(k))show(S.findIndex(x=>x.aula===+k-1))});
addEventListener('click',e=>{if(e.target.closest('[data-go]'))return;if(e.clientX>innerWidth/2)show(i+1);else show(i-1)});
show(0);
</script></body></html>
